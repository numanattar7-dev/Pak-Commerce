version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: pakcommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: pakcommerce_user
      POSTGRES_PASSWORD: pakcommerce_password
      POSTGRES_DB: pakcommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pakcommerce_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: