services:
  - type: web
    name: pak-commerce-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: pak-commerce-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JAZZCASH_MERCHANT_ID
        sync: false
      - key: JAZZCASH_PASSWORD
        sync: false
      - key: JAZZCASH_INTEGRITY_SALT
        sync: false
      - key: JAZZCASH_SANDBOX
        value: "true"
      - key: JAZZCASH_RETURN_URL
        sync: false
      - key: JAZZCASH_CALLBACK_URL
        sync: false
      - key: EASYPAISA_MERCHANT_ID
        sync: false
      - key: EASYPAISA_PASSWORD
        sync: false
      - key: EASYPAISA_STORE_ID
        sync: false
      - key: EASYPAISA_SANDBOX
        value: "true"
      - key: EASYPAISA_RETURN_URL
        sync: false
      - key: EASYPAISA_CALLBACK_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false

databases:
  - name: pak-commerce-db
    databaseName: pak_commerce
    user: pak_commerce_user
    plan: free
    region: singapore